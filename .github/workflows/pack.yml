name: Umbra pack

# Run by hand: builds Umbra and puts it together with the pack's mods (tools/compat/pack.json) into a Modrinth
# .mrpack and a plain .zip, published to branch ci-pack.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build Umbra
        run: ./gradlew build -x test --stacktrace > build.log 2>&1 || (tail -60 build.log; exit 1)
      - name: Put the pack together
        run: |
          mkdir -p pack
          ls -la build/libs
          python3 tools/compat/make_pack.py "$(ls build/libs/umbra-*.jar | grep -v sources | head -1)" pack > pack/pack.log 2>&1; rc=$?
          cat pack/pack.log; [ $rc = 0 ] || exit $rc
          # the same as a .7z (some Windows setups balk at the plain zip)
          z=$(ls pack/umbra-pack-*.zip | head -1); d=$(mktemp -d); unzip -q "$z" -d "$d"
          (cd "$d" && 7z a -t7z -mx=7 "$GITHUB_WORKSPACE/${z%.zip}.7z" . > /dev/null) && 7z t "${z%.zip}.7z" | tail -3
      - name: Publish
        if: always()
        run: .github/scripts/publish.sh ci-pack pack/*.mrpack pack/*.zip pack/*.7z pack/pack.md pack/pack.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
