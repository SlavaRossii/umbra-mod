name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      probe:
        description: "Space-separated classes to dump with javap (debugging API changes)"
        required: false
        default: ""
      grep:
        description: "Regex of class paths to list from the Minecraft/NeoForge jar"
        required: false
        default: ""
      files:
        description: "Space-separated resource paths to print from the Minecraft jar"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          grep -nE -A4 'error:|warning: \[removal\]|FAILURE|What went wrong' build.log > errors.txt || tail -200 build.log > errors.txt

      - name: Probe Minecraft API (on failure or on request)
        if: failure() || inputs.probe != '' || inputs.grep != '' || inputs.files != ''
        env:
          PROBE: ${{ inputs.probe }}
          GREP: ${{ inputs.grep }}
          FILES: ${{ inputs.files }}
        run: |
          JAR=""
          for j in $(find build/moddev ~/.gradle/caches -name '*.jar' 2>/dev/null | grep -iE 'neoforge|minecraft' | grep -v sources); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/world/level/Level.class'; then JAR="$j"; break; fi
          done
          echo "jar: $JAR"
          if [ -z "$JAR" ]; then find build/moddev -name '*.jar' > probe.txt; exit 0; fi
          CLASSES="$PROBE"
          if [ -f build.log ]; then
            CLASSES="$CLASSES $(grep -oE '(location: (class|interface)|of type) [a-z][A-Za-z0-9_.]*\.[A-Z][A-Za-z0-9_$]*' build.log | awk '{print $NF}' | grep -v '^dev\.umbra' | sort -u | tr '\n' ' ')"
          fi
          {
            echo "jar: $JAR"
            if [ -n "$GREP" ]; then echo "=== classes matching $GREP"; jar tf "$JAR" | grep -E -- "$GREP" | grep -v '\$[0-9]' | head -300; fi
            for f in $FILES; do echo "=================== file $f"; unzip -p "$JAR" "$f" 2>&1 | head -6000; done
            for c in $CLASSES; do
              echo "=================== $c"
              javap -cp "$JAR" -p "$c" 2>&1 | grep -v 'lambda\$' | head -3000
            done
          } > probe.txt

      - name: Publish build output to branch ci-output
        if: always()
        run: .github/scripts/publish.sh ci-output build.log errors.txt probe.txt build/libs/*.jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload mod jar
        uses: actions/upload-artifact@v5
        with:
          name: umbra-mod-jar
          path: build/libs/*.jar
          if-no-files-found: error

  client-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri x11-apps imagemagick > /dev/null
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          sleep 2
          DISPLAY=:99 glxinfo -B | head -20 || true

      - name: Run the client to the title screen
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p run-client
          printf "onboardAccessibility:false\nnarrator:0\njoinedFirstServer:true\n" > run-client/options.txt
          ( timeout 15m ./gradlew runClientCheck --stacktrace > client-gradle.log 2>&1; echo "client exited with $?" >> client-gradle.log ) &
          for i in $(seq 1 160); do
            sleep 5
            if [ -f run-client/umbra-clientcheck.txt ]; then break; fi
            if grep -q "UMBRA CLIENTCHECK\|Narrator\|Created: .*atlas" run-client/logs/latest.log 2>/dev/null && [ ! -f shot1.png ]; then sleep 20; import -window root -display :99 shot1.png || true; fi
          done
          import -window root -display :99 shot2.png || true
          sleep 20
          tail -5 client-gradle.log || true

      - name: Publish client-check results
        if: always()
        run: |
          set +e
          { cat run-client/umbra-clientcheck.txt 2>/dev/null || echo "no report"; echo "----- warnings about models and textures -----";
            grep -nE 'Missing|Unable to|Failed to|Exception|ERROR|umbra' run-client/logs/latest.log 2>/dev/null | grep -v 'UMBRA CLIENTCHECK: done' | head -400;
            echo "----- gradle tail -----"; tail -80 client-gradle.log; } > client.txt
          cp run-client/logs/latest.log client.log 2>/dev/null
          .github/scripts/publish.sh ci-client client.txt client.log shot1.png shot2.png
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run dedicated server self-test
        run: |
          mkdir -p run-smoke
          echo "eula=true" > run-smoke/eula.txt
          printf "online-mode=false\nspawn-protection=0\n" > run-smoke/server.properties
          timeout 20m ./gradlew runSmokeServer --stacktrace || echo "server exited with $?"

      - name: Check self-test report
        run: |
          echo "----- report -----"
          cat run-smoke/umbra-smoketest.txt || { echo "no report: the server did not reach the test"; tail -150 run-smoke/logs/latest.log; exit 1; }
          echo "----- errors/exceptions in server log -----"
          grep -nE 'ERROR|Exception|umbra' run-smoke/logs/latest.log | grep -v 'UMBRA SMOKETEST: ok' | head -100 || true
          grep -q 'UMBRA SMOKETEST: PASSED' run-smoke/umbra-smoketest.txt

      - name: Publish smoke-test results
        if: always()
        run: |
          set +e
          { cat run-smoke/umbra-smoketest.txt 2>/dev/null; echo; echo "----- crash reports -----"; cat run-smoke/crash-reports/*.txt 2>/dev/null | head -400; echo "----- log excerpts -----";
            grep -nE -B2 -A12 'ERROR|Exception|umbra|UMBRA' run-smoke/logs/latest.log 2>/dev/null | head -3000; } > smoke.txt
          { head -c 3000000 run-smoke/logs/latest.log; echo; echo '----- tail -----'; tail -c 6000000 run-smoke/logs/latest.log; } > server.log 2>/dev/null || true
          ls -la run-smoke/logs || true
          .github/scripts/publish.sh ci-smoke smoke.txt server.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-test-logs
          path: |
            run-smoke/umbra-smoketest.txt
            run-smoke/logs/latest.log
          if-no-files-found: ignore
