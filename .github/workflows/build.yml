name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      probe:
        description: "Space-separated classes to dump with javap (debugging API changes)"
        required: false
        default: ""
      grep:
        description: "Regex of class paths to list from the Minecraft/NeoForge jar"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Probe Minecraft API (on failure or on request)
        if: failure() || inputs.probe != '' || inputs.grep != ''
        env:
          PROBE: ${{ inputs.probe }}
          GREP: ${{ inputs.grep }}
        run: |
          ls -la build/moddev/artifacts 2>/dev/null || true
          JAR=$(find build/moddev -name 'neoforge-*.jar' ! -name '*sources*' | head -1)
          echo "jar: $JAR"
          [ -z "$JAR" ] && exit 0
          if [ -n "$GREP" ]; then
            echo "=== classes matching $GREP"
            jar tf "$JAR" | grep -E -- "$GREP" | grep -v '\$[0-9]' | head -300
          fi
          CLASSES="$PROBE"
          if [ -f build.log ]; then
            CLASSES="$CLASSES $(grep -oE '(location: (class|interface)|of type) [a-z][A-Za-z0-9_.]*\.[A-Z][A-Za-z0-9_$]*' build.log | awk '{print $NF}' | grep -v '^dev\.umbra' | sort -u | tr '\n' ' ')"
          fi
          for c in $CLASSES; do
            echo "=================== $c"
            javap -cp "$JAR" -p "$c" 2>&1 | grep -v 'lambda\$' | head -400
          done

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: umbra-mod-jar
          path: build/libs/*.jar
          if-no-files-found: error

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run dedicated server self-test
        run: |
          mkdir -p run-smoke
          echo "eula=true" > run-smoke/eula.txt
          printf "online-mode=false\nspawn-protection=0\n" > run-smoke/server.properties
          timeout 20m ./gradlew runSmokeServer --stacktrace || echo "server exited with $?"

      - name: Check self-test report
        run: |
          echo "----- report -----"
          cat run-smoke/umbra-smoketest.txt || { echo "no report: the server did not reach the test"; tail -150 run-smoke/logs/latest.log; exit 1; }
          echo "----- errors/exceptions in server log -----"
          grep -nE 'ERROR|Exception|umbra' run-smoke/logs/latest.log | grep -v 'UMBRA SMOKETEST: ok' | head -100 || true
          grep -q 'UMBRA SMOKETEST: PASSED' run-smoke/umbra-smoketest.txt

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: |
            run-smoke/umbra-smoketest.txt
            run-smoke/logs/latest.log
          if-no-files-found: ignore
